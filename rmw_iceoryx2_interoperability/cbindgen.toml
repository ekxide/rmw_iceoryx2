language = "C++"
pragma_once = true
include_guard = "RMW_ICEORYX2_INTEROPERABILITY_H"
autogen_warning = "// Generated by cbindgen from the rmw_iceoryx2_interoperability crate. Do not edit."
namespace = "rmw_iceoryx2_interoperability"

# The MessageInfoHeader type name (a string constant cbindgen cannot emit) is injected from the
# Rust-defined constant by build.rs via `after_includes`.

[export]
include = ["MessageInfoHeader"]

[parse]
parse_deps = false
